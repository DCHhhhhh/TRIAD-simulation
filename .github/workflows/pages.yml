name: Deploy reviewed TRIAD showcase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate exact public file allowlist and hashes
        run: python3 scripts/validate_pages.py deploy/pages --repository .
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the reviewed static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@v4
